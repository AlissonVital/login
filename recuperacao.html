<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recuperação de senha — Site Modelo" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Recuperação de Senha</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="home-btn" href="index.html" aria-label="Voltar para a página inicial">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.2 3.5 10.2h2.3V20h5.1v-5.4h2.2V20h5.1V10.2h2.3L12 3.2z" />
        </svg>
      </a>

      <h1 class="page-title">Recuperação de Senha</h1>

      <form id="recuperacao-form" class="form-shell" novalidate>
        <div class="field">
          <label for="nova-senha">Nova Senha</label>
          <div class="password-field">
            <input
              id="nova-senha"
              name="novaSenha"
              type="password"
              autocomplete="new-password"
              required
              minlength="6"
            />
            <button
              type="button"
              class="toggle-password"
              data-toggle-password="nova-senha"
              aria-label="Mostrar senha"
            ></button>
          </div>
        </div>

        <div class="field">
          <label for="confirma-senha">Nova Senha</label>
          <div class="password-field">
            <input
              id="confirma-senha"
              name="confirmaSenha"
              type="password"
              autocomplete="new-password"
              required
              minlength="6"
            />
            <button
              type="button"
              class="toggle-password"
              data-toggle-password="confirma-senha"
              aria-label="Mostrar senha"
            ></button>
          </div>
        </div>

        <p id="mismatch-error" class="field-error" role="alert" aria-live="polite"></p>

        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn btn-cancel">CANCELAR</button>
          <button type="submit" id="btn-submit" class="btn btn-submit">ENVIAR</button>
        </div>
      </form>
    </main>

    <script type="module" src="js/recuperacao.js"></script>
  </body>
</html>
