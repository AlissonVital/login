<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login — Site Modelo" />
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="home-btn" href="index.html" aria-label="Voltar para a página inicial">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.2 3.5 10.2h2.3V20h5.1v-5.4h2.2V20h5.1V10.2h2.3L12 3.2z" />
        </svg>
      </a>

      <h1 class="page-title">Login</h1>

      <form id="login-form" class="form-shell" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="password-field">
            <input
              id="senha"
              name="senha"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              data-toggle-password="senha"
              aria-label="Mostrar senha"
            ></button>
          </div>
        </div>

        <div class="recover-link-wrap">
          <button type="button" id="recover-link" class="recover-link">Recuperar senha</button>
        </div>

        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn btn-cancel">CANCELAR</button>
          <button type="submit" id="btn-submit" class="btn btn-submit">ENVIAR</button>
        </div>
      </form>
    </main>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
